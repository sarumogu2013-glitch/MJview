# push と PR のたびに、テストと Windows でのビルドを確かめる。
name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

# 同じブランチで新しく push したら、前の実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup update stable && rustup default stable
      - name: ffmpeg（RTMP のテスト用）
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
      - uses: Swatinem/rust-cache@v2
      - name: テスト
        run: cargo test --workspace
      - name: 依存のライセンス（寛容なものだけか）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo about generate tools/about.hbs -o target/licenses.html

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: テスト
        run: cargo test --workspace
