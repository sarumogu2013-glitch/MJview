[package]
name = "janscope-client"
description = "JanScope 配信クライアント（出力ウィンドウ・操作ウィンドウ・選手用画面）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "janscope-client"
path = "src/main.rs"

[dependencies]
janscope-core.workspace = true
janscope-netclient.workspace = true
janscope-video.workspace = true
janscope-update.workspace = true
# --dummy-server: ダミー対局データ入りのサーバーをクライアントの中で動かす
janscope-server.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
bevy = { version = "=0.20.1", default-features = false, features = [
    "default_app", "std", "multi_threaded", "bevy_winit", "x11",
    "ui_api", "ui_bevy_render", "2d_bevy_render", "bevy_window", "bevy_text", "png",
    "keyboard", "mouse",
] }
# manage_clipboard: 入力欄のコピー・貼り付け（Ctrl+C / Ctrl+V）
bevy_egui = { version = "=0.43.1", default-features = false, features = ["render", "manage_clipboard"] }
# ファイル・フォルダを選ぶダイアログ（Windows は標準のダイアログ。Linux は xdg-desktop-portal）
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
resvg = "0.49"
winit = { version = "0.30", default-features = false }

[build-dependencies]
winresource = "0.1"
