[package]
name = "janscope-update"
description = "JanScope 自動アップデート: GitHub Releases の確認・取得・適用"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.11"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "platform-verifier"] }
semver = "1.0.28"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
