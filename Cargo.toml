[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "crates/netclient", "crates/video", "crates/update", "crates/majsoul", "crates/client"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sarumogu2013-glitch/MJview"
rust-version = "1.85"

[workspace.dependencies]
janscope-core = { path = "crates/core" }
janscope-netclient = { path = "crates/netclient" }
janscope-video = { path = "crates/video" }
janscope-update = { path = "crates/update" }
janscope-server = { path = "crates/server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
mahc = "=2.2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev.package."*"]
opt-level = 2
