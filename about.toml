# cargo about generate tools/about.hbs -o licenses.html
# 配布物に入れる Rust 依存のライセンス一覧を作る設定。ここにない（寛容でない）ライセンスの依存が入ると失敗する
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
private = { ignore = true }
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "OFL-1.1",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MIT-0",
    "0BSD",
]
